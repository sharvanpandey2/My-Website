<!--
  SR-ONE HORIZONTAL LOGO — LIGHT BACKGROUND VERSION
  ===================================================
  Use on light / off-white backgrounds (navbar, footer if light, print).

  TO EDIT:
  - "SR" color: fill="#0B1B2B" on the first <text>
  - "-ONE" color: fill="#1F7A6C" on the second <text>
  - Subtitle color: fill="#5B6472" on the third <text>
  - Icon mark colors: the two triangle fills + node fill in the <g>
-->
<svg width="230" height="54" viewBox="0 0 230 54" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SR-ONE Consultancy logo">
  <g transform="translate(2,7) rotate(45 18 18)">
    <path d="M4 4 H32 V32 Z" fill="#0B1B2B"/>
    <path d="M4 4 V32 H32 Z" fill="#1F7A6C"/>
  </g>
  <line x1="6.7" y1="32.8" x2="30.8" y2="8.7" stroke="#F7F6F3" stroke-width="1" opacity="0.4" transform="translate(0,0)"/>
  <circle cx="20" cy="25" r="3.4" fill="#E8A33D"/>

  <text x="52" y="31" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="0.5" fill="#0B1B2B">SR<tspan fill="#1F7A6C">-ONE</tspan></text>
  <text x="52" y="46" font-family="'Inter', Arial, sans-serif" font-size="9.5" letter-spacing="2" fill="#5B6472">CONSULTANCY</text>
</svg>
